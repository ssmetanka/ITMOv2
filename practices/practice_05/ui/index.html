<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>AI-Review Console</title>
    <style>
      body { font-family: sans-serif; margin: 1rem; }
      textarea { width: 100%; height: 180px; }
      .counter.exceeded { color: red; }
      .history { margin-top: 1rem; }
      button[disabled] { opacity: 0.5; }
    </style>
  </head>
  <body>
    <h1>AI-Review Console</h1>
    <div>
      <textarea id="diff" placeholder="Paste diff..."></textarea>
      <div class="counter" id="counter" aria-live="polite"></div>
      <button id="check" disabled>Проверить</button>
      <div id="status" aria-live="polite"></div>
    </div>
    <div class="history">
      <h3>Последние ревью</h3>
      <ul id="history"></ul>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
  </html>
